[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-chatter"
version = "0.1.0"
description = "Index a code repository and answer questions with file:line citations."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23,!=0.26.0",  # 0.26.0: Point.row refcount bug
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
