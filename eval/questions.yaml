# Codebase Chatter eval set, batch 1.
#
# corpus:   stdlib  -> Python 3.13 asyncio, email, http, json (the indexed subset)
#           chatter -> the codebase-chatter repo itself
# type:     exact_name | behavior | location | flow | negative
# relevant: chunk IDs that count as a correct retrieval (any one = hit).
#           stdlib IDs are UNVERIFIED and must be checked against chunks.jsonl.
#           chatter IDs are empty; relevant_hint describes what should go there.
# expect_abstain: true when the corpus does not contain the answer.

# ---------- stdlib: exact names ----------

- id: q01
  corpus: stdlib
  type: exact_name
  question: "What is JSONDecodeError and what extra information does it carry about where parsing failed?"
  relevant:
    - "json/decoder.py::JSONDecodeError"
  expect_abstain: false
  notes: "Known baseline weakness: the defining class ranked 5th-6th for the bare name."

- id: q02
  corpus: stdlib
  type: exact_name
  question: "What does make_msgid produce and how does it make the value unique?"
  relevant:
    - "email/utils.py::make_msgid"
  expect_abstain: false
  notes: "Easy control question; should be a top-1 hit."

