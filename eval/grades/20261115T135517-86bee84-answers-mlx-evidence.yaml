  q05: 'begin() sets chunked for Transfer-Encoding: chunked and ignores Content-Length (http/client.py:356-371), read() dispatches to read_chunked (client.py:472-473), which loops over get_chunk_left() appending safe_read pieces (client.py:591-609); chunk-size reading starts at client.py:537-539 (C4)'
