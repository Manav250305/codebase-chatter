  h01: JSONDecoder.decode raw_decodes, skips trailing whitespace, and raises JSONDecodeError("Extra data", s, end) when end != len(s) (json/decoder.py:340-349); the position attributes come from JSONDecodeError (decoder.py:20-40)
  h02: 'false abstention: the shown JSONObject appends each (key, value) pair in order and then does pairs = dict(pairs), so the last duplicate wins unless object_pairs_hook is given the full pair list (json/decoder.py:190, 213-219)'
  h03: 'it presents http.client''s HTTPResponse.check_close (a client reading a server''s response, http/client.py:396-423) as the built-in server''s logic, though no http/server.py code was shown; it also contradicts itself ("otherwise assumed open" vs "defaults to closing"), whereas check_close keeps HTTP/1.1 open unless Connection: close (client.py:398-403)'
  h04: the request state machine ("a second request may not be started until {response-headers-read}", http/client.py:45) has nothing to do with header count, and begin() keeps looping while 100 Continue responses arrive instead of stopping them (client.py:330-338); it ignored the shown MAXHEADERS = 100 (client.py:112) and the server's "Too many headers" HTTPException handling around parse_headers (http/server.py:345-359)
  h05: the HTTPStatus enum in http/_init_.py stores value, phrase and description, with NOT_FOUND = (404, 'Not Found', 'Nothing matches the given URI') (http/_init_.py:6-31, 99-100)
  h06: 'supported: DateHeader.parse calls utils.parsedate_to_datetime (email/headerregistry.py:300-303), which returns an aware datetime when an offset is present (email/utils.py:315-323); wrong: parse is a classmethod parse(cls, value, kwds) that fills kwds, so DateHeader().parse("...") followed by .datetime does not work (headerregistry.py:292-311), and the example''s -0000 input gives a naive datetime, not one with a timezone (headerregistry.py:280-282)'
  h07: the shown chunks cover parsing boundaries (email/feedparser.py:306-440) and MIMEPart helpers that only set a boundary the caller passes in (email/message.py:1139-1173); how the generator chooses a boundary (make_boundary) is not shown
  h08: asyncio.to_thread runs the function in a separate thread via loop.run_in_executor(None, ...) with the context copied (asyncio/threads.py:12-25)
  h09: 'supported: sleep() with delay <= 0 awaits _sleep0 (asyncio/tasks.py:705-706), a bare yield that skips one loop cycle without a Future (tasks.py:691-700); unsupported: how control returns and the task resumes, which the docstring assigns to Task._step (tasks.py:697); _step is not shown, and the answer''s "the event loop detects the yield" has no basis in the shown lines'
  h10: waiters sit in a collections.deque, release() calls wake_up_next, which wakes the first waiter that is not done, and locked() plus the "Maintain FIFO" comment stop newcomers from jumping the queue (asyncio/locks.py:380-448)
  h11: the shown chunks cover TCP/Unix connections and socket sends (asyncio/streams.py:26-100, asyncio/base_events.py:1015-1203); there is no websocket code in context
  h12: tokenize_code lowercases identifiers and adds their snake_case/camelCase parts, e.g. parseHTTPResponse -> parsehttpresponse parse http response (src/chatter/index.py:94-114); it is used for chunk tokens (index.py:117-118) and BM25 queries in Retriever.search (src/chatter/retrieve.py:161), and tests show camel- and snake-case queries finding parse_http_response (tests/test_retrieve.py:114-125, tests/test_cli.py:149-157)
  h13: 'check_manifest raises IndexMismatchError when the manifest model != embedder.name (src/chatter/index.py:288-297), Retriever.open calls it (src/chatter/retrieve.py:134), and the CLI turns it into a --rebuild hint (src/chatter/cli.py:200-202; tests/test_cli.py:191-195); not mentioned: by default the CLI loads the index''s own model from the manifest (cli.py:196-198)'
  h14: each ContextBlock carries its tag plus a location property that formats path:ranges from shown_lines (src/chatter/answer.py:109-124) via format_line_ranges (answer.py:329-341), with shown_lines set in full_block/truncated_block (answer.py:267-300); it leaves out the citation-parsing/CLI step named in the module docstring (answer.py:4-6)
