notes:
  q01: ValueError subclass carrying msg, doc, pos, lineno and colno matches the docstring and _init_ at json/decoder.py:20-40
  q02: <timeval.pid.rand@domain> built from os.getpid(), random.getrandbits(64) and a socket.getfqdn() default is supported (email/utils.py:302-311), but timeval is int(time.time()*100), hundredths of a second, not milliseconds (utils.py:302), and the optional idstring that the docstring says strengthens uniqueness (utils.py:292-294, 305-308) is left out of both the format and the uniqueness explanation
  q03: 'false abstention: shown Runner.close calls cancel_all_tasks(loop) before closing the loop (asyncio/runners.py:64-79, call at :70), _exit_ calls close (runners.py:61-62), and run() executes main inside `with Runner(...)` (runners.py:194-195), so leftover tasks are cancelled when main returns'
  q04: allow_nan true emits NaN/Infinity/-Infinity (not spec compliant but consistent with JS encoders) and false raises ValueError, per the _init_ docstring (json/encoder.py:123-126) and floatstr (encoder.py:224-244); calling them "strings" is loose wording because the tokens are written unquoted
  q05: 'transfer-encoding: chunked sets self.chunked (http/client.py:355-359), read() dispatches to read_chunked (client.py:472-473), which loops over get_chunk_left, appends safe_read data and honours amt (client.py:591-609); close handling in begin/read (client.py:362-394, 463-501)'
  q06: 'iter_attachments skips the first text/plain, text/html, multipart/related or multipart/alternative part unless it has Content-Disposition: attachment, returns all but the root for multipart/related, and yields nothing for multipart/alternative or non-multipart (email/message.py:1066-1119)'
  q07: the shown chunks only encode (Header.encode, ValueFormatter, body_encode, formatparam) or decode quoted-printable bodies (email/quoprimime.py:232-276); nothing shown decodes an RFC 2047 encoded word like =?utf-8?b?...?= (decode_header was not retrieved)
  q08: asyncio.timeout(delay) async context manager with the 10-second example, TimeoutError on expiry, timeout_at for an absolute loop.time() deadline, and CancelledError converted to TimeoutError are all in asyncio/timeouts.py:145-184 (and _aexit_ 97-125)
  q09: get() raises QueueShutDown when the queue is shut down and empty or shut down immediately (asyncio/queues.py:177-182), and shutdown() unblocks waiting getters by setting their futures to None so they loop and raise (queues.py:253-279); the last sentence loosely credits get() with what shutdown() does to pending getters
  q10: translate_path skips any component where os.path.dirname(word) is set or word is os.curdir/os.pardir before joining onto self.directory (http/server.py:855-861)
  q11: 'supported: iterencode creates the markers dict only when check_circular is true (json/encoder.py:215-218), and the check exists to prevent infinite recursion (encoder.py:118-121); unsupported and misplaced: no shown line does the "already in markers -> refuse" check, and iterencode only hands markers to c_make_encoder/make_iterencode (encoder.py:251-260), so the detection itself lives in make_iterencode, which the model was not shown'
  q12: set_tunnel documents HTTP CONNECT tunnelling through the proxy (http/client.py:890-924), HTTPConnection.connect calls self.tunnel() when tunnel_host is set (client.py:1012-1013), and HTTPSConnection.connect calls super().connect() then wraps the socket for the tunnel host (client.py:1469-1480)
  q13: 'supported: task exceptions go into errors (asyncio/taskgroups.py:242), the parent task is cancelled if it is not already being cancelled (taskgroups.py:255-278), and aexit raises BaseExceptionGroup (taskgroups.py:161-178); missing or wrong: it never says the sibling tasks are cancelled via abort (taskgroups.py:221-226, class docstring 24-26), which is half the question, and "no other errors are present" misstates the rule, since all errors are collected'
  q14: as_bytes creates a BytesGenerator over a BytesIO, flattens the message and returns the bytes (email/message.py:196-209), and BytesGenerator subclasses Generator (email/generator.py:406); but Message has no set_header() method (the shown class has _setitem_, add_header and replace_header at message.py:425, 551, 581)
  q15: the shown asyncio chunks (constants, AbstractEventLoop, Server, sendfile fallback, create_server) contain no HTTP retry or exponential backoff logic
