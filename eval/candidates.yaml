# Retrieval configs frozen for held-out evaluation. Do not edit after the
# first held-out run; add a new file for new candidates instead.
#
# Chosen on the tune split only (20 scored questions), from
# eval/results/20261004T160306-6789697-tune.json and the earlier k x w grid in
# eval/results/20261004T155330-292898d-tune.json. Strict MRR@50 on tune and
# paired wins/losses/ties vs dense-only:
#   dense-only  0.524           reference
#   default     0.523  6/8/6    loses dense top-5 hits (q18 1->7, q20 1->3)
#   k10-w3      0.574  5/5/10   wins near the top; losses only below dense rank 9
#
# The decision rule is decided on tune+heldout combined, so the held-out run
# scores every split (no --split). candidates-graph.yaml repeats these configs
# and applies this rule first, so one run decides both:
#   chatter eval eval/questions.yaml --candidates eval/candidates-graph.yaml

decision_rule:
  name: fusion
  kind: select
  text: >
    Among default and k10-w3, choose the config with the best paired W/L vs
    dense-only (strict first relevant rank) over tune+heldout combined: most
    wins minus losses, then fewest losses, then higher strict MRR@50, then
    listed order. Adopt it only if it has more wins than losses and zero
    top-3 losses vs dense-only; otherwise dense-only becomes the default.
  reference: dense-only
  candidates: [default, k10-w3]
  paired_metric: strict first relevant rank
  splits: [tune, heldout]

configs:
  - name: dense-only
    mode: dense

  - name: default
    mode: fused
    rrf_k: 60
    dense_weight: 1.0

  - name: k10-w3
    mode: fused
    rrf_k: 10
    dense_weight: 3.0
